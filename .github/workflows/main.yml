name: Windows-RDP-Secure-Telegram-TCP

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'مدة التشغيل بالدقائق (360 max)'
        required: false
        default: '360'

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Download Cloudflared
        run: curl -L --output cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe

      - name: Check Secrets
        shell: pwsh
        run: |
          if ("${{ secrets.RDP_USERNAME }}" -eq "") { Write-Error "Missing RDP_USERNAME"; exit 1 }
          if ("${{ secrets.RDP_PASSWORD }}" -eq "") { Write-Error "Missing RDP_PASSWORD"; exit 1 }
          if ("${{ secrets.TELEGRAM_BOT_TOKEN }}" -eq "") { Write-Error "Missing TELEGRAM_BOT_TOKEN"; exit 1 }
          if ("${{ secrets.TELEGRAM_CHAT_ID }}" -eq "") { Write-Error "Missing TELEGRAM_CHAT_ID"; exit 1 }

      - name: Enable RDP and Create User
        shell: pwsh
        run: |
          $user = "${{ secrets.RDP_USERNAME }}"
          $pass = "${{ secrets.RDP_PASSWORD }}"
          Write-Host "::add-mask::$user"
          Write-Host "::add-mask::$pass"
          net user $user $pass /add
          net localgroup administrators $user /add
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service TermService -Force
          Start-Sleep -Seconds 5
          $portOpen = (Get-NetTCPConnection -LocalPort 3389).Count -gt 0
          if (-not $portOpen) { Write-Error "Port 3389 not open"; exit 1 }
          Write-Host "RDP is ready"

      - name: Create Stable TCP Tunnel
        shell: pwsh
        run: |
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = ".\cloudflared.exe"
          $psi.Arguments = "tunnel --protocol http2 --url tcp://localhost:3389"
          $psi.UseShellExecute = $false
          $psi.RedirectStandardError = $true
          $psi.RedirectStandardOutput = $true
          $psi.CreateNoWindow = $true
          $proc = [System.Diagnostics.Process]::Start($psi)
          $url = $null
          $timeout = 90
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          while ($sw.Elapsed.TotalSeconds -lt $timeout -and -not $proc.HasExited) {
            Start-Sleep -Milliseconds 500
            $line = $proc.StandardError.ReadLine()
            if ($line -and $line -match '(https://[a-z0-9-]+\.trycloudflare\.com)') {
              $url = $matches[1]
              Write-Host "::add-mask::$url"
              break
            }
          }
          if (-not $url) {
            Write-Error "Failed to obtain tunnel URL"
            exit 1
          }
          $url | Out-File -FilePath tunnel_url.txt -Encoding ascii
          $proc.Id | Out-File -FilePath tunnel.pid
          Write-Host "Stable TCP tunnel created"

      - name: Send Connection Instructions to Telegram
        shell: pwsh
        run: |
          $url = Get-Content tunnel_url.txt -Raw
          $hostname = $url -replace 'https://',''
          $user = "${{ secrets.RDP_USERNAME }}"
          $pass = "${{ secrets.RDP_PASSWORD }}"
          $duration = "${{ github.event.inputs.duration_minutes }}"
          # بناء الرسالة بدون heredoc
          $msg = "✅ RDP Tunnel Ready (Stable Connection)%0A%0A"
          $msg += "🔗 Tunnel URL: $url%0A%0A"
          $msg += "📥 Instructions (Very Important):%0A"
          $msg += "1. Download cloudflared from: https://github.com/cloudflare/cloudflared/releases%0A"
          $msg += "2. Open a terminal in the folder where you downloaded cloudflared.exe%0A"
          $msg += "3. Run this command:%0A"
          $msg += "   cloudflared access tcp --hostname $hostname --url localhost:3333%0A"
          $msg += "4. Keep this terminal window open and running.%0A"
          $msg += "5. Open Remote Desktop Connection (Run: mstsc).%0A"
          $msg += "6. Enter: localhost:3333 in the Computer field.%0A"
          $msg += "7. Enter the following credentials:%0A"
          $msg += "   Username: $user%0A"
          $msg += "   Password: $pass%0A"
          $msg += "8. Click Connect and accept any certificate warning.%0A%0A"
          $msg += "⏱️ Tunnel active for $duration minutes."
          $api = "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage"
          $body = "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=$msg"
          Invoke-RestMethod -Uri $api -Method Post -Body $body -ContentType "application/x-www-form-urlencoded" | Out-Null
          Write-Host "Instructions sent to Telegram"

      - name: Keep Runner Alive
        shell: pwsh
        run: |
          $minutes = [int]${{ github.event.inputs.duration_minutes }}
          if ($minutes -gt 360) { $minutes = 360 }
          Write-Host "Tunnel active for $minutes minutes"
          Start-Sleep -Seconds ($minutes * 60)

      - name: Cleanup
        shell: pwsh
        if: always()
        run: |
          if (Test-Path tunnel.pid) {
            $pid = Get-Content tunnel.pid
            Stop-Process -Id $pid -Force -ErrorAction SilentlyContinue
          }
          $user = "${{ secrets.RDP_USERNAME }}"
          if ($user) { net user $user /delete 2>$null }
          Write-Host "Cleanup completed"
