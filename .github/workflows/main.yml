name: Windows-RDP-Secure-Telegram-TCP

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'مدة التشغيل بالدقائق (360 max)'
        required: false
        default: '360'

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Download Cloudflared
        run: curl -L --output cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe

      - name: Check Secrets
        shell: pwsh
        run: |
          if ("${{ secrets.RDP_USERNAME }}" -eq "") { Write-Error "Missing RDP_USERNAME"; exit 1 }
          if ("${{ secrets.RDP_PASSWORD }}" -eq "") { Write-Error "Missing RDP_PASSWORD"; exit 1 }
          if ("${{ secrets.TELEGRAM_BOT_TOKEN }}" -eq "") { Write-Error "Missing TELEGRAM_BOT_TOKEN"; exit 1 }
          if ("${{ secrets.TELEGRAM_CHAT_ID }}" -eq "") { Write-Error "Missing TELEGRAM_CHAT_ID"; exit 1 }

      - name: Enable RDP and Create User
        shell: pwsh
        run: |
          $user = "${{ secrets.RDP_USERNAME }}"
          $pass = "${{ secrets.RDP_PASSWORD }}"
          Write-Host "::add-mask::$user"
          Write-Host "::add-mask::$pass"
          net user $user $pass /add
          net localgroup administrators $user /add
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service TermService -Force
          Start-Sleep -Seconds 10
          Write-Host "RDP Enabled. Checking port..."
          if (Test-NetConnection localhost -Port 3389 -InformationLevel Quiet) {
            Write-Host "Port 3389 is listening."
          } else {
            Write-Error "Port 3389 not open."
          }

      - name: Start Tunnel (TCP mode)
        shell: pwsh
        run: |
          $stderrLog = "stderr.log"
          $urlFile = "tunnel_url.txt"
          Remove-Item -Force $stderrLog, $urlFile -ErrorAction SilentlyContinue

          # تشغيل النفق في الخلفية
          $proc = Start-Process -FilePath ".\cloudflared.exe" `
            -ArgumentList "tunnel --protocol http2 --url tcp://localhost:3389" `
            -WindowStyle Hidden -PassThru `
            -RedirectStandardError $stderrLog

          # انتظار الرابط
          $url = $null
          for ($i=0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 1
            $content = Get-Content $stderrLog -Raw -ErrorAction SilentlyContinue
            if ($content -match '(https://[a-z0-9-]+\.trycloudflare\.com)') {
              $url = $matches[1]
              break
            }
          }
          if (-not $url) {
            Write-Host "Failed to get tunnel URL"
            Get-Content $stderrLog
            exit 1
          }
          Write-Host "::add-mask::$url"
          $url | Out-File $urlFile
          $proc.Id | Out-File tunnel.pid

      - name: Test Tunnel Internally (using cloudflared access)
        shell: pwsh
        run: |
          $url = Get-Content tunnel_url.txt
          $hostname = $url -replace 'https://',''
          Write-Host "Testing tunnel connectivity..."
          # تشغيل access tcp في الخلفية
          $accessProc = Start-Process -FilePath ".\cloudflared.exe" `
            -ArgumentList "access tcp --hostname $hostname --url localhost:4444" `
            -WindowStyle Hidden -PassThru `
            -RedirectStandardError access_err.log
          Start-Sleep -Seconds 5
          # اختبار الاتصال بـ localhost:4444
          $test = Test-NetConnection localhost -Port 4444 -InformationLevel Quiet
          if ($test) {
            Write-Host "Tunnel works! (port 4444 reachable)"
          } else {
            Write-Host "Tunnel test failed. But continuing..."
          }
          Stop-Process -Id $accessProc.Id -Force -ErrorAction SilentlyContinue

      - name: Send to Telegram
        shell: pwsh
        run: |
          $url = Get-Content tunnel_url.txt
          $hostname = $url -replace 'https://',''
          $user = "${{ secrets.RDP_USERNAME }}"
          $pass = "${{ secrets.RDP_PASSWORD }}"
          $duration = "${{ github.event.inputs.duration_minutes }}"
          $msg = "✅ RDP Tunnel Ready%0A%0A"
          $msg += "🔗 Tunnel URL: $url%0A%0A"
          $msg += "⚠️ IMPORTANT: Do NOT open this URL in browser (it will show error 530). That's normal.%0A%0A"
          $msg += "📥 How to connect:%0A"
          $msg += "1. Download cloudflared from: https://github.com/cloudflare/cloudflared/releases%0A"
          $msg += "2. Open command prompt in that folder%0A"
          $msg += "3. Run this command:%0A"
          $msg += "   cloudflared access tcp --hostname $hostname --url localhost:3333%0A"
          $msg += "4. Leave that window open%0A"
          $msg += "5. Open Remote Desktop (mstsc) and connect to: localhost:3333%0A"
          $msg += "6. Enter credentials:%0A"
          $msg += "   Username: $user%0A"
          $msg += "   Password: $pass%0A"
          $msg += "7. Accept certificate warning%0A%0A"
          $msg += "⏱️ Tunnel active for $duration minutes."
          $api = "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage"
          $body = "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=$msg"
          Invoke-RestMethod -Uri $api -Method Post -Body $body -ContentType "application/x-www-form-urlencoded" | Out-Null

      - name: Keep Alive
        shell: pwsh
        run: |
          $minutes = [int]${{ github.event.inputs.duration_minutes }}
          if ($minutes -gt 360) { $minutes = 360 }
          Write-Host "Keeping runner alive for $minutes minutes"
          Start-Sleep -Seconds ($minutes * 60)

      - name: Cleanup
        shell: pwsh
        if: always()
        run: |
          if (Test-Path tunnel.pid) { Stop-Process -Id (Get-Content tunnel.pid) -Force -ErrorAction SilentlyContinue }
          Get-Process -Name cloudflared -ErrorAction SilentlyContinue | Stop-Process -Force
          $user = "${{ secrets.RDP_USERNAME }}"
          if ($user) { net user $user /delete 2>$null }
          Write-Host "Cleanup done."
