name: Windows-RDP-Secure-Telegram-TCP

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'مدة التشغيل بالدقائق (360 max)'
        required: false
        default: '360'

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Download Cloudflared
        run: curl -L --output cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe

      - name: Check Secrets
        shell: pwsh
        run: |
          if ("${{ secrets.RDP_USERNAME }}" -eq "") { Write-Error "Missing RDP_USERNAME"; exit 1 }
          if ("${{ secrets.RDP_PASSWORD }}" -eq "") { Write-Error "Missing RDP_PASSWORD"; exit 1 }
          if ("${{ secrets.TELEGRAM_BOT_TOKEN }}" -eq "") { Write-Error "Missing TELEGRAM_BOT_TOKEN"; exit 1 }
          if ("${{ secrets.TELEGRAM_CHAT_ID }}" -eq "") { Write-Error "Missing TELEGRAM_CHAT_ID"; exit 1 }

      - name: Enable RDP and Create User
        shell: pwsh
        run: |
          $user = "${{ secrets.RDP_USERNAME }}"
          $pass = "${{ secrets.RDP_PASSWORD }}"
          Write-Host "::add-mask::$user"
          Write-Host "::add-mask::$pass"
          net user $user $pass /add
          net localgroup administrators $user /add
          # تعطيل NLA تمامًا
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          # إعادة تشغيل الخدمة
          Restart-Service TermService -Force
          Start-Sleep -Seconds 10
          # فتح المنفذ في جدار الحماية بشكل إضافي
          netsh advfirewall firewall add rule name="RDP-TCP" dir=in action=allow protocol=TCP localport=3389
          Write-Host "RDP configured"

      - name: Test Local RDP
        shell: pwsh
        run: |
          # اختبار بسيط: هل المنفذ يستمع؟
          $listening = Get-NetTCPConnection -LocalPort 3389 -ErrorAction SilentlyContinue
          if ($listening) {
            Write-Host "RDP is listening on port 3389"
          } else {
            Write-Error "RDP not listening"
          }
          # اختبار الاتصال المحلي باستخدام mstsc (صامت)
          $tempRdpFile = "$env:TEMP\test.rdp"
          "full address:s:localhost`nusername:s:${{ secrets.RDP_USERNAME }}" | Out-File $tempRdpFile
          # لن نحاول الاتصال فعليًا، فقط نتحقق من إمكانية
          Write-Host "Local RDP seems ready"

      - name: Start Tunnel (rdp protocol) and Capture URL
        shell: pwsh
        run: |
          $stderrLog = "stderr.log"
          $urlFile = "tunnel_url.txt"
          Remove-Item -Force $stderrLog, $urlFile -ErrorAction SilentlyContinue

          # استخدام بروتوكول rdp وليس tcp
          $proc = Start-Process -FilePath ".\cloudflared.exe" `
            -ArgumentList "tunnel --protocol http2 --url rdp://localhost:3389" `
            -WindowStyle Hidden -PassThru `
            -RedirectStandardError $stderrLog

          $timeout = 120
          $url = $null
          for ($i=0; $i -lt $timeout; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path $stderrLog) {
              $content = Get-Content $stderrLog -Raw
              if ($content -match '(https://[a-z0-9-]+\.trycloudflare\.com)') {
                $url = $matches[1]
                break
              }
            }
          }

          if (-not $url) {
            Write-Host "ERROR: No tunnel URL"
            Get-Content $stderrLog
            exit 1
          }

          Write-Host "::add-mask::$url"
          $url | Out-File $urlFile
          $proc.Id | Out-File tunnel.pid
          Write-Host "Tunnel ready: $url"

      - name: Send to Telegram
        shell: pwsh
        run: |
          $url = Get-Content tunnel_url.txt
          $hostname = $url -replace 'https://',''
          $user = "${{ secrets.RDP_USERNAME }}"
          $pass = "${{ secrets.RDP_PASSWORD }}"
          $duration = "${{ github.event.inputs.duration_minutes }}"
          $msg = "✅ RDP Tunnel Ready%0A%0A"
          $msg += "👉 $url%0A%0A"
          $msg += "🔧 Instructions:%0A"
          $msg += "1. Download cloudflared: https://github.com/cloudflare/cloudflared/releases%0A"
          $msg += "2. Run: cloudflared access tcp --hostname $hostname --url localhost:3333%0A"
          $msg += "3. Keep terminal open%0A"
          $msg += "4. Remote Desktop -> localhost:3333%0A"
          $msg += "   User: $user%0A"
          $msg += "   Pass: $pass%0A%0A"
          $msg += "⏱️ Active for $duration minutes."
          $api = "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage"
          $body = "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=$msg"
          Invoke-RestMethod -Uri $api -Method Post -Body $body -ContentType "application/x-www-form-urlencoded" | Out-Null

      - name: Keep Alive
        shell: pwsh
        run: |
          $minutes = [int]${{ github.event.inputs.duration_minutes }}
          if ($minutes -gt 360) { $minutes = 360 }
          Start-Sleep -Seconds ($minutes * 60)

      - name: Cleanup
        shell: pwsh
        if: always()
        run: |
          if (Test-Path tunnel.pid) { Stop-Process -Id (Get-Content tunnel.pid) -Force }
          Get-Process cloudflared -ErrorAction SilentlyContinue | Stop-Process -Force
          net user "${{ secrets.RDP_USERNAME }}" /delete 2>$null
