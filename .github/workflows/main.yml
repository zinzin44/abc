name: Windows-RDP-Secure-Telegram

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'مدة التشغيل بالدقائق'
        required: false
        default: '360'

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Download Cloudflared
        run: curl -L --output cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe

      - name: Check Secrets
        shell: pwsh
        run: |
          if ("${{ secrets.RDP_USERNAME }}" -eq "") { Write-Error "Missing RDP_USERNAME"; exit 1 }
          if ("${{ secrets.RDP_PASSWORD }}" -eq "") { Write-Error "Missing RDP_PASSWORD"; exit 1 }
          if ("${{ secrets.TELEGRAM_BOT_TOKEN }}" -eq "") { Write-Error "Missing TELEGRAM_BOT_TOKEN"; exit 1 }
          if ("${{ secrets.TELEGRAM_CHAT_ID }}" -eq "") { Write-Error "Missing TELEGRAM_CHAT_ID"; exit 1 }

      - name: Enable RDP and Create User
        shell: pwsh
        run: |
          $user = "${{ secrets.RDP_USERNAME }}"
          $pass = "${{ secrets.RDP_PASSWORD }}"
          Write-Host "::add-mask::$user"
          Write-Host "::add-mask::$pass"
          # Create user
          net user $user $pass /add
          net localgroup administrators $user /add
          # Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          # Disable NLA
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          # Allow RDP in firewall
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          # Restart service
          Restart-Service TermService -Force
          Start-Sleep -Seconds 5
          # Verify listening port
          $listening = netstat -an | Select-String ":3389.*LISTENING"
          if (-not $listening) {
              Write-Host "WARNING: Port 3389 not listening yet. Retrying..."
              Restart-Service TermService -Force
              Start-Sleep -Seconds 10
          }
          # Test local connectivity
          $portOpen = Test-NetConnection -ComputerName localhost -Port 3389 -InformationLevel Quiet
          Write-Host "RDP port open: $portOpen"
          if (-not $portOpen) {
              Write-Error "Port 3389 is not open. RDP setup failed."
              exit 1
          }

      - name: Start Cloudflare Tunnel
        shell: pwsh
        run: |
          # Start tunnel and capture URL
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = ".\cloudflared.exe"
          $psi.Arguments = "tunnel --url rdp://localhost:3389"
          $psi.UseShellExecute = $false
          $psi.RedirectStandardError = $true
          $psi.RedirectStandardOutput = $true
          $psi.CreateNoWindow = $true
          $proc = [System.Diagnostics.Process]::Start($psi)
          $url = $null
          $timeout = 90
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          while ($sw.Elapsed.TotalSeconds -lt $timeout -and -not $proc.HasExited) {
            Start-Sleep -Milliseconds 500
            $line = $proc.StandardError.ReadLine()
            if ($line -and $line -match '(https://[a-z0-9-]+\.trycloudflare\.com)') {
              $url = $matches[1]
              Write-Host "::add-mask::$url"
              break
            }
          }
          if (-not $url) {
            Write-Error "Could not extract tunnel URL"
            exit 1
          }
          # Save url and pid
          $url | Out-File -FilePath tunnel_url.txt -Encoding ascii
          $proc.Id | Out-File -FilePath tunnel.pid
          Write-Host "Tunnel started. URL stored."

      - name: Send Connection Info to Telegram
        shell: pwsh
        run: |
          $url = Get-Content tunnel_url.txt -Raw
          $user = "${{ secrets.RDP_USERNAME }}"
          $pass = "${{ secrets.RDP_PASSWORD }}"
          $duration = "${{ github.event.inputs.duration_minutes }}"
          $msg = "RDP Ready%0A%0AURL: $url%0AUser: $user%0APass: $pass%0ADuration: $duration min%0A%0AUse Microsoft Remote Desktop and accept certificate warning."
          $api = "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage"
          $body = "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=$msg"
          Invoke-RestMethod -Uri $api -Method Post -Body $body -ContentType "application/x-www-form-urlencoded" | Out-Null
          Write-Host "Info sent to Telegram."

      - name: Keep Runner Alive
        shell: pwsh
        run: |
          $minutes = [int]${{ github.event.inputs.duration_minutes }}
          if ($minutes -gt 360) { $minutes = 360 }
          Write-Host "Maintaining tunnel for $minutes minutes..."
          Start-Sleep -Seconds ($minutes * 60)

      - name: Cleanup
        shell: pwsh
        if: always()
        run: |
          if (Test-Path tunnel.pid) {
            $pid = Get-Content tunnel.pid
            Stop-Process -Id $pid -Force -ErrorAction SilentlyContinue
          }
          $user = "${{ secrets.RDP_USERNAME }}"
          if ($user) { net user $user /delete 2>$null }
          Write-Host "Cleanup completed."
